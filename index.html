<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#161618" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles.css" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="One lap. A new track every day. Race your friends' ghosts. No login." />
    <meta property="og:title" content="Daily lap" />
    <meta property="og:description" content="One lap. A new track every day. Can you beat my time?" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Daily lap</title>
  </head>
  <body data-mode="home">
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div class="hud-top">
        <button class="hud-btn" id="btn-quit" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <div class="timer">
          <div id="time">0.000</div>
          <div id="split"></div>
        </div>
        <button class="hud-btn" id="btn-restart" aria-label="Restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      </div>
      <div id="countdown"></div>
      <div class="pad" id="pad-left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>
      <div class="pad" id="pad-right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>
      <div class="first-hint">Hold left or right to steer</div>
      <div id="speedo" aria-hidden="true">
        <svg viewBox="0 0 200 116">
          <defs>
            <linearGradient id="speed-grad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#8a9bab" />
              <stop offset="0.6" stop-color="#b9a98a" />
              <stop offset="0.85" stop-color="#c08a6e" />
              <stop offset="1" stop-color="#b86a5c" />
            </linearGradient>
            <mask id="speed-ticks" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="116">
              <path d="M 22 104 A 78 78 0 0 1 178 104" fill="none" stroke="#fff" stroke-width="16" pathLength="100" stroke-dasharray="3.2 1.3" />
            </mask>
          </defs>
          <path class="speed-bg" d="M 22 104 A 78 78 0 0 1 178 104" fill="none" stroke-width="12" mask="url(#speed-ticks)" />
          <path id="speed-arc" d="M 22 104 A 78 78 0 0 1 178 104" fill="none" stroke="url(#speed-grad)" stroke-width="12" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" mask="url(#speed-ticks)" />
        </svg>
        <div class="speed-readout">
          <span id="speed-num">0</span>
          <span class="speed-unit">km/h</span>
        </div>
      </div>
    </div>

    <section id="home" class="panel"></section>
    <section id="finish" class="panel" hidden></section>
    <div id="toast"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
