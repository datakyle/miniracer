name: ci

# GitHub Pages serves this branch as-is ("Deploy from a branch", main, root).
# The source is plain ES modules, so no build is needed to play. This
# workflow only checks that the tests pass and that the Vite build still works.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
